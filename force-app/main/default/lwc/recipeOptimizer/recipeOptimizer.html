<template>
    <section class="workbench">
        <template if:true={isSaving}>
            <div class="save-spinner">
                <lightning-spinner alternative-text="Saving" size="small"></lightning-spinner>
            </div>
        </template>

        <div class="split-shell">
            <!-- LEFT: Product catalog (25%) -->
            <aside class="catalog-sidebar">
                <p class="eyebrow">Products</p>
                <div class="catalog-header">
                    <h1 class="page-title">Product catalog</h1>
                </div>

                <div class="catalog-toolbar">
                    <lightning-input
                        type="search"
                        variant="label-hidden"
                        placeholder="Search products..."
                        value={productSearchTerm}
                        onchange={handleProductSearch}
                        class="search-input"
                    ></lightning-input>
                    <button type="button" class="btn btn-dark btn-block" onclick={handleToggleNewProduct}>
                        + New product
                    </button>
                </div>

                <template if:true={isNewProductOpen}>
                    <div class="new-product-panel">
                        <div class="form-grid">
                            <lightning-input
                                label="Product Name"
                                data-field="name"
                                value={newProduct.name}
                                onchange={handleNewProductChange}
                            ></lightning-input>
                            <lightning-input
                                label="Description (optional)"
                                data-field="description"
                                value={newProduct.description}
                                onchange={handleNewProductChange}
                            ></lightning-input>
                            <lightning-input
                                type="number"
                                label="Total Product Weight (g)"
                                data-field="totalWeight"
                                value={newProduct.totalWeight}
                                onchange={handleNewProductChange}
                            ></lightning-input>
                            <lightning-combobox
                                label="Category"
                                data-field="category"
                                value={newProduct.category}
                                options={categoryOptions}
                                onchange={handleNewProductChange}
                            ></lightning-combobox>
                            <lightning-input
                                type="number"
                                label="Target Margin (%)"
                                data-field="targetMargin"
                                value={newProduct.targetMargin}
                                onchange={handleNewProductChange}
                            ></lightning-input>
                        </div>
                        <div class="panel-actions">
                            <button type="button" class="btn btn-dark" onclick={handleCreateProduct}>Create product</button>
                            <button type="button" class="btn btn-ghost" onclick={handleClearProductForm}>Clear</button>
                        </div>
                    </div>
                </template>

                <div class="product-list">
                    <template for:each={filteredProducts} for:item="product">
                        <button
                            type="button"
                            key={product.id}
                            class={product.cardClass}
                            data-id={product.id}
                            onclick={handleProductRowSelect}
                        >
                            <div class="product-card-top">
                                <span class="product-name">{product.name}</span>
                                <span class={product.categoryBadgeClass}>{product.categoryLabel}</span>
                            </div>
                            <p class="product-details">{product.detailsLabel}</p>
                            <span class="product-price">{product.lastPriceDisplay}</span>
                        </button>
                    </template>
                    <template if:false={hasFilteredProducts}>
                        <p class="empty-state">No products found.</p>
                    </template>
                </div>
            </aside>

            <!-- RIGHT: Formulation (75%) -->
            <main class="formulation-main">
                <template if:true={hasSelectedProduct}>
                    <section class="formulation">
                        <p class="eyebrow">{formulationBreadcrumb}</p>
                        <h2 class="formulation-title">{formulationTitle}</h2>

                        <div class="metric-ribbon">
                            <div class="metric">
                                <span class="metric-label">Total weight</span>
                                <span class="metric-value">{totalWeightRibbonLabel}</span>
                            </div>
                            <div class="metric">
                                <span class="metric-label">Estimated cost</span>
                                <span class="metric-value">{estimatedCostLabel}</span>
                            </div>
                            <div class="metric">
                                <span class="metric-label">Target margin</span>
                                <span class="metric-value">{targetMarginRibbonLabel}</span>
                            </div>
                            <div class="metric metric-accent">
                                <span class="metric-label">Price if optimized</span>
                                <span class="metric-value gold">{optimizedPriceRibbonLabel}</span>
                                <template if:true={hasFromPrice}>
                                    <span class="metric-from">from {oldDistributionNewPriceLabel}</span>
                                </template>
                            </div>
                        </div>

                        <div class="workspace">
                            <div class="main-col">
                                <section class="panel composition-panel">
                                    <div class="composition-header">
                                        <div>
                                            <h3 class="panel-title">Composition</h3>
                                            <p class="panel-caption">{compositionSubtitle}</p>
                                        </div>
                                        <div class="composition-actions">
                                            <button type="button" class="btn btn-outline" onclick={handleRefreshAi}>
                                                Refresh market
                                            </button>
                                            <button
                                                type="button"
                                                class="btn btn-dark"
                                                onclick={handleOptimizeRecipe}
                                                disabled={isOptimizeDisabled}
                                            >
                                                Optimize recipe
                                            </button>
                                        </div>
                                    </div>

                                    <div class="mix-chart">
                                        <div class="distribution-bar" title="Current mix">
                                            <template for:each={distributionSegments} for:item="seg">
                                                <div key={seg.key} class="dist-seg" style={seg.style} title={seg.title}>
                                                    <template if:true={seg.showLabel}>
                                                        <span class="dist-label">{seg.percentLabel}</span>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                        <div class="mix-legend">
                                            <template for:each={distributionSegments} for:item="seg">
                                                <span key={seg.key} class="legend-item">
                                                    <span class="legend-swatch" style={seg.swatchStyle}></span>
                                                    <span class="legend-name">{seg.name}</span>
                                                </span>
                                            </template>
                                        </div>
                                    </div>

                                    <div class={gridLoadingHostClass}>
                                        <template if:true={isAiLoading}>
                                            <div class="loading-overlay" role="status">
                                                <c-ai-agent-spinner
                                                    alternative-text="Optimizing recipe"
                                                    label="Running Ingredient Optimization AI..."
                                                    size="medium"
                                                ></c-ai-agent-spinner>
                                            </div>
                                        </template>

                                        <div class="ingredient-rows">
                                            <template for:each={ingredientTableRows} for:item="row" for:index="index">
                                                <div key={row.clientKey} class="ingredient-row">
                                                    <span class="swatch" style={row.swatchStyle}></span>
                                                    <span class="ing-name">{row.ingredientName}</span>
                                                    <label class="weight-field">
                                                        <input
                                                            type="number"
                                                            class="weight-input"
                                                            data-index={index}
                                                            value={row.weight}
                                                            min="0"
                                                            step="0.01"
                                                            onchange={handleWeightChange}
                                                        />
                                                        <span class="weight-suffix">g</span>
                                                    </label>
                                                    <span class="ing-pct">{row.percentageLabel}</span>
                                                    <template if:true={row.hasAiBadge}>
                                                        <span class={row.aiBadgeClass}>{row.aiBadgeLabel}</span>
                                                    </template>
                                                    <template if:false={row.hasAiBadge}>
                                                        <span class="ai-badge ai-empty">—</span>
                                                    </template>
                                                    <button
                                                        type="button"
                                                        class="icon-btn"
                                                        title="Remove"
                                                        data-index={index}
                                                        onclick={handleRemoveIngredient}
                                                    >
                                                        <lightning-icon icon-name="utility:delete" size="x-small" alternative-text="Remove"></lightning-icon>
                                                    </button>
                                                </div>
                                            </template>
                                            <template if:false={hasIngredientRows}>
                                                <p class="empty-state">Add ingredients to this product, then save the recipe.</p>
                                            </template>
                                        </div>
                                    </div>

                                    <div class="add-row">
                                        <lightning-combobox
                                            label="Add Ingredient"
                                            variant="label-hidden"
                                            value={ingredientToAdd}
                                            options={filteredIngredientOptions}
                                            onchange={handleIngredientToAddChange}
                                            placeholder="Select ingredient to add..."
                                            class="add-combo"
                                        ></lightning-combobox>
                                        <button type="button" class="btn btn-outline" onclick={handleAddIngredientFromCatalog}>
                                            + Add row
                                        </button>
                                    </div>
                                </section>

                                <section class="price-impact">
                                    <h3 class="panel-title">Price impact</h3>
                                    <div class="impact-grid">
                                        <article class="impact-card">
                                            <p class="impact-label">Current distribution</p>
                                            <p class="impact-value">{oldDistributionNewPriceLabel}</p>
                                        </article>
                                        <article class="impact-card impact-optimized">
                                            <p class="impact-label">If AI weights applied</p>
                                            <p class="impact-value impact-green">{newDistributionNewPriceLabel}</p>
                                        </article>
                                    </div>
                                </section>
                            </div>

                            <aside class="insights-col panel">
                                <h3 class="panel-title">Ingredient insights</h3>
                                <p class="panel-caption">{insightsSubtitle}</p>
                                <div class={insightsLoadingHostClass}>
                                    <template if:true={isInsightsLoading}>
                                        <div class="loading-overlay" role="status">
                                            <c-ai-agent-spinner
                                                alternative-text="Loading live commodity prices"
                                                label="Loading live commodity prices..."
                                                size="medium"
                                            ></c-ai-agent-spinner>
                                        </div>
                                    </template>
                                    <div class="card-grid">
                                        <template for:each={displayCards} for:item="card">
                                            <c-ingredient-card
                                                key={card.cardId}
                                                card={card}
                                                oncardselect={handleCardSelect}
                                                onmoreinfo={handleMoreInfo}
                                            ></c-ingredient-card>
                                        </template>
                                    </div>
                                </div>
                            </aside>
                        </div>

                        <footer class="page-footer">
                            <button type="button" class="btn btn-ghost" onclick={handleClearProductForm}>Clear form</button>
                            <button type="button" class="btn btn-dark" onclick={handleSave}>Save recipe</button>
                        </footer>
                    </section>
                </template>

                <template if:false={hasSelectedProduct}>
                    <div class="formulation-empty">
                        <p class="empty-state select-hint">Select or create a product to edit its formulation.</p>
                    </div>
                </template>
            </main>
        </div>
    </section>

    <template if:true={isNewIngredientOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container modal-container">
                <header class="modal-header">
                    <h2 class="modal-heading">Add new ingredient</h2>
                    <button type="button" class="icon-btn modal-close" onclick={handleCloseNewIngredient}>
                        <lightning-icon icon-name="utility:close" size="x-small" alternative-text="Close"></lightning-icon>
                    </button>
                </header>
                <div class="modal-body">
                    <template if:true={isCreatingIngredient}>
                        <div class="modal-saving">
                            <c-ai-agent-spinner alternative-text="Creating" label="Creating ingredient..." size="small"></c-ai-agent-spinner>
                        </div>
                    </template>
                    <div class="modal-form-grid">
                        <lightning-input
                            label="Ingredient Name"
                            data-field="name"
                            value={newIngredient.name}
                            onchange={handleNewIngredientChange}
                            required
                        ></lightning-input>
                        <lightning-combobox
                            label="Unit"
                            data-field="unit"
                            value={newIngredient.unit}
                            options={unitOptions}
                            onchange={handleNewIngredientChange}
                        ></lightning-combobox>
                        <lightning-input
                            type="number"
                            label="Default Cost (per ton)"
                            data-field="defaultCost"
                            value={newIngredient.defaultCost}
                            onchange={handleNewIngredientChange}
                            step="0.01"
                        ></lightning-input>
                        <lightning-input
                            label="Flavor Profile (optional)"
                            data-field="flavorProfile"
                            value={newIngredient.flavorProfile}
                            onchange={handleNewIngredientChange}
                        ></lightning-input>
                    </div>
                </div>
                <footer class="modal-footer">
                    <button type="button" class="btn btn-ghost" onclick={handleCloseNewIngredient}>Cancel</button>
                    <button type="button" class="btn btn-dark" onclick={handleCreateIngredient} disabled={isCreatingIngredient}>Create &amp; add to recipe</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template if:true={isMoreInfoOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container modal-container">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">{moreInfoTitle}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <template if:true={isHistoryLoading}>
                        <lightning-spinner alternative-text="Loading history" size="small"></lightning-spinner>
                    </template>
                    <template if:false={isHistoryLoading}>
                        <p class="modal-note">Price history graph placeholder (max 1 month).</p>
                        <ul class="history-list">
                            <template for:each={priceHistoryPoints} for:item="point">
                                <li key={point.date}>
                                    <span>{point.date}</span>
                                    <strong>${point.price}</strong>
                                </li>
                            </template>
                        </ul>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label="Close" onclick={handleCloseMoreInfo}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
